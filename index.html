<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>City Mafia Club — Rollar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="mark mark-left" aria-hidden="true">C</div>
  <div class="mark mark-right" aria-hidden="true">S</div>

  <header>
    <img src="citym.jpeg" alt="City Mafia Club loqosu">
    <div class="title">
      <span class="flourish" aria-hidden="true"></span>
      <h1>Oyunun rolları</h1>
      <span class="flourish flourish-right" aria-hidden="true"></span>
    </div>
    <p>Rolun bacarığını görmək üçün karta toxunun. Geri çevirmək üçün yenidən toxunun.</p>
    <div class="ornament" aria-hidden="true">
      <span></span><i></i><i></i><i></i><span></span>
    </div>
  </header>

  <nav class="filters" aria-label="Rolları süz">
    <button type="button" class="is-active" data-filter="all" aria-pressed="true">Hamısı <em>14</em></button>
    <button type="button" data-filter="mafia" aria-pressed="false"><i class="dot mafia"></i>Mafiya klanı</button>
    <button type="button" data-filter="city" aria-pressed="false"><i class="dot city"></i>Şəhər sakinləri</button>
    <button type="button" data-filter="neutral" aria-pressed="false"><i class="dot neutral"></i>Neytrallar</button>
  </nav>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="ornament" aria-hidden="true">
      <span></span><i></i><i></i><i></i><span></span>
    </div>
    <p class="brand">City Mafia Club · Bakı</p>
    <p class="tag">Gecənin qaydaları bir baxışda</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
